<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>George Hildick-Smith — moved</title>
  <meta name="robots" content="noindex" />
  <!-- Fallback for visitors with scripts switched off: always go to the new site's home page. -->
  <meta http-equiv="refresh" content="1; url=https://george-hs.duckdns.org/" />
  <script>
    // GitHub Pages serves this page for any address under /website/ that no longer
    // has a file behind it — which, now the old site has been removed, is all of
    // them. Send each old address to its closest equivalent on the new site.
    (function () {
      var p = location.pathname.replace(/^\/website\/?/, "/").toLowerCase();
      var dest = "/";
      if (/^\/projects\/perlin/.test(p)) dest = "/projects/perlin";
      else if (/^\/projects/.test(p)) dest = "/projects";
      else if (/^\/cv\/.*\.pdf$/.test(p)) dest = "/cv.pdf";
      else if (/^\/cv/.test(p)) dest = "/cv";
      location.replace("https://george-hs.duckdns.org" + dest + location.hash);
    })();
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 80px auto; padding: 0 24px; color: #1a1a1a; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <p>This site has moved. Redirecting you to <a href="https://george-hs.duckdns.org/">george-hs.duckdns.org</a>&hellip;</p>
</body>
</html>
